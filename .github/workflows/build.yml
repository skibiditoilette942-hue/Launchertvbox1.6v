name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Preparar projeto
        run: |
          ls -la
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*')" ]; then
            ZIP=$(find . -maxdepth 2 -name '*.zip' | head -n1)
            if [ -z "$ZIP" ]; then echo "ERRO: nenhum zip nem projeto no repositorio"; exit 1; fi
            unzip -oq "$ZIP"
          fi
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)")
          echo "Projeto em: $DIR"
          find . -name LEIA-ME.txt -path '*res*' -delete
          if [ -f background.jpg ]; then
            cp background.jpg "$DIR/app/src/main/res/drawable-nodpi/background.jpg"
          fi
          echo "DIR=$DIR" >> $GITHUB_ENV

      - name: Compilar
        run: cd "$DIR" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MeuLauncher-apk
          path: "**/build/outputs/apk/debug/app-debug.apk"
